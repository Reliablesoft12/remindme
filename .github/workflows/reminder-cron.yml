name: 🔔 Reminder Cron Job

on:
  schedule:
    # Runs every 15 minutes (GitHub Actions minimum interval)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  process-reminders:
    name: Process Due Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run reminder cron
        working-directory: backend
        env:
          RUN_CRON_ONLY: 'true'
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME: ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run cron

      - name: Commit updated data files
        run: |
          git config --local user.email "remindme-bot@github.com"
          git config --local user.name "RemindMe Bot"
          git add backend/data/
          git diff --staged --quiet || git commit -m "🔔 Auto: Updated reminder data [skip ci]"
          git push
