name: 🔔 Reminder Cron Job

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    name: Process Due Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run reminder cron
        working-directory: backend
        env:
          RUN_CRON_ONLY: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME: ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run cron
