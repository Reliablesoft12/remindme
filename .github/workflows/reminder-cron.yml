name: 🔔 Reminder Cron Job

on:
  schedule:
    # Run every 10 minutes for better reliability
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Manual trigger from Actions tab

jobs:
  process-reminders:
    name: Process Due Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run reminder cron
        working-directory: backend
        env:
          RUN_CRON_ONLY: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AISENSY_API_KEY: ${{ secrets.AISENSY_API_KEY }}
          AISENSY_CAMPAIGN_NAME: ${{ secrets.AISENSY_CAMPAIGN_NAME }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run cron
